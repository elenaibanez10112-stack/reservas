<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castillo de la Guardia - Gestión de Espacios</title>
    <style>
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { background-color: #f4f6f7; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #2c3e50; }
        header { background-color: #1a252f; color: white; padding: 1.2rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); position: sticky; top: 0; z-index: 1000; }
        header h1 { margin: 0; font-size: 1.6rem; font-weight: 700; letter-spacing: 1px; color: #ffffff; }
        nav a { color: #ffffff; text-decoration: none; margin-right: 1.8rem; font-weight: 600; font-size: 1rem; transition: color 0.2s; }
        nav a:hover { color: #bfa15f; }
        nav a:last-child { margin-right: 0; }
        .seccion { min-height: 100vh; padding: 3rem 1.5rem; display: flex; align-items: center; justify-content: center; }
        .contenedor { max-width: 1100px; margin: 0 auto; width: 100%; }
        .tarjeta-principal { max-width: 750px; margin: 0 auto; background: #ffffff; padding: 3rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); border-top: 6px solid #bfa15f; }
        .titulo-seccion { text-align: center; margin-bottom: 2.5rem; }
        .titulo-seccion h2 { color: #1a252f; margin: 0 0 0.5rem 0; font-size: 2.2rem; font-weight: 800; letter-spacing: 1.5px; }
        .subtitulo { color: #bfa15f; font-weight: 700; margin: 0; text-transform: uppercase; font-size: 0.95rem; letter-spacing: 2px; }
        
        form { display: flex; flex-direction: column; gap: 1.5rem; }
        .grid-doble { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .campo { display: flex; flex-direction: column; gap: 0.5rem; }
        .campo label { font-weight: 700; color: #1a252f; font-size: 0.95rem; }
        .campo input, .campo select { padding: 0.8rem; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 1rem; background-color: #f8fafc; color: #2c3e50; width: 100%; }
        
        .boton-principal { background-color: #1a252f; color: white; border: none; padding: 1rem; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 1.1rem; margin-top: 1rem; transition: background-color 0.2s; letter-spacing: 0.5px; width: 100%; text-align: center; }
        .boton-principal:hover { background-color: #bfa15f; }

        @media (max-width: 600px) {
            .grid-doble { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
    <header>
        <h1>CASTILLO DE LA GUARDIA</h1>
        <nav>
            <a href="#inicio">Inicio</a>
            <a href="#reservas">Reservas</a>
            <a href="#detalle">Detalle</a>
        </nav>
    </header>

    <main class="seccion" id="inicio">
        <div class="contenedor">
            <div class="tarjeta-principal">
                <div class="titulo-seccion">
                    <p class="subtitulo">Gestión de Espacios Históricos</p>
                    <h2>SOLICITUD DE RESERVA</h2>
                </div>

                <form action="procesar.php" method="POST">
                    <div class="grid-doble">
                        <div class="campo">
                            <label for="nombre_usuario">Nombre:</label>
                            <input type="text" id="nombre_usuario" name="nombre_usuario" placeholder="Ej. Elena" required>
                        </div>
                        <div class="campo">
                            <label for="apellidos_usuario">Apellidos:</label>
                            <input type="text" id="apellidos_usuario" name="apellidos_usuario" placeholder="Ej. Ibáñez Pérez" required>
                        </div>
                    </div>

                    <div class="grid-doble">
                        <div class="campo">
                            <label for="email_usuario">Correo Electrónico:</label>
                            <input type="email" id="email_usuario" name="email_usuario" placeholder="ejemplo@correo.com" required>
                        </div>
                        <div class="campo">
                            <label for="telefono_usuario">Teléfono:</label>
                            <input type="tel" id="telefono_usuario" name="telefono_usuario" placeholder="600123456" required>
                        </div>
                    </div>

                    <div class="grid-doble">
                        <div class="campo">
                            <label for="fecha">Fecha del Evento:</label>
                            <input type="date" id="fecha" name="fecha" required>
                        </div>
                        <div class="campo">
                            <label for="id_recurso">Tipo de Celebración:</label>
                            <select id="id_recurso" name="id_recurso" required>
                                <option value="1">Sesión Fotográfica</option>
                                <option value="2">Boda / Matrimonio</option>
                                <option value="3">Evento Corporativo</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="boton-principal">Confirmar Reserva →</button>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
