<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Castillo de la Guardia - Gestión de Espacios</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>CASTILLO DE LA GUARDIA</h1>
        <nav>
            <a href="#inicio">Inicio</a>
            <a href="#reservas">Reservas</a>
            <a href="#detalle">Detalle</a>
        </nav>
    </header>

    <main class="seccion" id="inicio">
        <div class="contenedor">
            <div class="tarjeta-principal">
                <div class="titulo-seccion">
                    <p class="subtitulo">Gestión de Espacios Históricos</p>
                    <h2>SOLICITUD DE RESERVA</h2>
                </div>

                <!-- CORRECCIÓN: El formulario ahora redirige físicamente a procesar.php -->
                <form action="procesar.php" method="POST">

                    <div class="campo">
                        <label for="nombre">Nombre Completo:</label>
                        <!-- CORRECCIÓN: Añadido name="nombre" -->
                        <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
                    </div>

                    <div class="campo">
                        <label for="fecha">Fecha del Evento:</label>
                        <!-- CORRECCIÓN: Añadido name="fecha" -->
                        <input type="date" id="fecha" name="fecha" required>
                    </div>

                    <div class="campo">
                        <label for="celebracion">Tipo de Celebración:</label>
                        <!-- CORRECCIÓN: Añadido name="celebracion" -->
                        <select id="celebracion" name="celebracion">
                            <option value="Visita Cultural Privada">Visita Cultural Privada</option>
                            <option value="Banquete o Gala">Banquete o Gala</option>
                            <option value="Sesión Fotográfica">Sesión Fotográfica</option>
                        </select>
                    </div>

                    <button type="submit" class="boton-principal">Continuar al Catálogo →</button>
                </form>

            </div>
        </div>
    </main>

    <!-- NOTA: Se eliminó el JavaScript antiguo que bloqueaba el envío real del formulario -->

</body>

</html>
