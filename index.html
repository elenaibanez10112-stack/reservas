<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reservas - Castillo de la Guardia</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Castillo de la Guardia</h1>
        <h2>Formulario de Reserva de Entradas</h2>
    </header>
    <main>
        <section id="seccion-reserva">
            <form id="form-reserva" action="#" method="POST">
                <div class="input-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej. Juan Pérez">
                </div>
                <div class="input-group">
                    <label for="correo">Correo Electrónico:</label>
                    <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com">
                </div>
                <div class="input-group">
                    <label for="asistentes">Número de asistentes (Máximo 5):</label>
                    <input type="number" id="asistentes" name="asistentes" min="1" max="5" required>
                </div>
                <button type="submit" id="btn-enviar">Confirmar Reserva</button>
            </form>
        </section>
        <section id="mensaje-confirmacion" style="display: none;">
            <p>¡Reserva procesada con éxito! Se ha enviado un correo de confirmación automático.</p>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
